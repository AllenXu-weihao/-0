<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 365" role="img" aria-labelledby="ft"><title id="ft">单个基带向量的计算流，外部算子与控制器通过三组接口相连</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#536773"/></marker></defs><rect width="920" height="365" fill="#faf9f5"/><g font-family="Microsoft YaHei, sans-serif" font-size="15" fill="#193644"><text x="20" y="32" font-size="19" font-weight="bold">外部计算 / External operators</text><text x="20" y="181" font-size="19" font-weight="bold">FPGA 控制器 / Proposed controller</text><rect x="18" y="55" width="170" height="65" rx="5" fill="#e4e9ec"/><text x="28" y="81">y, H → 前端求解</text><text x="28" y="104" font-size="13">每流保留 9 个候选</text><rect x="218" y="55" width="150" height="65" rx="5" fill="#e4e9ec"/><text x="228" y="81">A2 · 稀疏 MVM</text><text x="228" y="104" font-size="13">β 与 local 拼接</text><rect x="411" y="55" width="230" height="65" rx="5" fill="#e4e9ec"/><text x="421" y="81">统计、残差似然 → A13</text><text x="421" y="104" font-size="13">λ 与 ai 拼接后做 MVM</text><rect x="726" y="55" width="170" height="65" rx="5" fill="#e4e9ec"/><text x="736" y="81">A5 · 稀疏 MVM</text><text x="736" y="104" font-size="13">β 与 local → z</text><rect x="215" y="204" width="156" height="65" rx="5" fill="#c6e7da"/><text x="225" y="230">减峰值、稳定排序</text><text x="225" y="253" font-size="13">输出分数与 idx</text><rect x="446" y="204" width="186" height="65" rx="5" fill="#c6e7da"/><text x="456" y="230">按 idx 散回、阻尼</text><text x="456" y="253" font-size="13">旧 β 读 / 新 β 写</text><rect x="735" y="204" width="155" height="65" rx="5" fill="#c6e7da"/><text x="745" y="230">末轮分组求最大</text><text x="745" y="253" font-size="13">24 个有符号 LLR</text><g stroke="#536773" stroke-width="2" fill="none" marker-end="url(#arrow)"><path d="M188 87H216"/><path d="M293 120V201"/><path d="M371 223H390V91H409"/><path d="M525 120V201"/><path d="M371 249H443"/><path d="M632 232H688V90H724"/><path d="M812 120V201"/><path d="M520 269V318H200V139H250V122"/></g><text x="386" y="268">idx</text><text x="281" y="344">β 跨轮反馈 · 首轮读零 · 共 3 轮</text></g></svg>
