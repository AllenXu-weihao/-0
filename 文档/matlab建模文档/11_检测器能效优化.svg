<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" role="img" aria-labelledby="title desc"><title id="title">如何从候选检测器中选出每焦耳检测比特数最高的实现</title><desc id="desc">相同输入分别送给双精度参考和候选实现。通过检测质量、实时性、资源及功能检查后，按统一边界计算能效并比较。</desc><style>text{font-family:"Microsoft YaHei",sans-serif;fill:#153746}.hd{font-weight:700;font-size:23px}.body{font-size:19px}</style><defs><marker id="arr" orient="auto" markerWidth="7" markerHeight="7" refX="6" refY="3.5"><path d="M0 0L7 3.5L0 7" fill="#52717b"/></marker></defs><rect width="960" height="580" rx="18" fill="#f5f6f1"/><rect x="180" y="18" width="600" height="76" fill="#fff" stroke="#bacbc9" rx="12"/><text text-anchor="middle" x="480.0" y="50" class="hd">同一批检测向量</text><text text-anchor="middle" x="480.0" y="79" class="body">4 发 8 收 · 64-QAM · 每流 9 个候选 · 3 轮更新</text><path d="M480 94V111H240V130" fill="none" stroke="#52717b" stroke-width="2.5" marker-end="url(#arr)"/><path d="M480 111H720V130" fill="none" stroke="#52717b" stroke-width="2.5" marker-end="url(#arr)"/><rect x="24" y="134" width="432" height="83" fill="#e6edf2" stroke="#bacbc9" rx="12"/><text text-anchor="middle" x="240.0" y="166" class="hd">双精度 MATLAB 参考 D₀</text><text text-anchor="middle" x="240.0" y="195" class="body">输出 24 个 LLR，与真值比对得到基线误码</text><rect x="504" y="134" width="432" height="83" fill="#dfefe8" stroke="#bacbc9" rx="12"/><text text-anchor="middle" x="720.0" y="166" class="hd">候选实现 Dθ</text><text text-anchor="middle" x="720.0" y="195" class="body">选择字长、并行度与缓存，输出 24 个 LLR</text><path d="M240 217V237H395V254" fill="none" stroke="#52717b" stroke-width="2.5" marker-end="url(#arr)"/><path d="M720 217V237H565V254" fill="none" stroke="#52717b" stroke-width="2.5" marker-end="url(#arr)"/><rect x="60" y="258" width="840" height="80" fill="#fff" stroke="#bacbc9" rx="12"/><text text-anchor="middle" x="480.0" y="290" class="hd">筛选可行配置</text><text text-anchor="middle" x="480.0" y="319" class="body">逐 SNR 配对检验误码，同时核对吞吐、延时、时序、资源和算术功能</text><path d="M480 338V366" fill="none" stroke="#52717b" stroke-width="2.5" marker-end="url(#arr)"/><rect x="60" y="370" width="840" height="80" fill="#fff" stroke="#bacbc9" rx="12"/><text text-anchor="middle" x="480.0" y="402" class="hd">对通过筛选的配置，测量同一批 N 个向量</text><text text-anchor="middle" x="480.0" y="431" class="body">有效输出 24N bit　｜　同一测量范围、同一时间窗 T 内耗能 E</text><path d="M480 450V478" fill="none" stroke="#52717b" stroke-width="2.5" marker-end="url(#arr)"/><rect x="60" y="482" width="840" height="80" fill="#cde9df" stroke="#bacbc9" rx="12"/><text text-anchor="middle" x="480.0" y="514" class="hd">按 η = 24N / E = 吞吐量 / 平均功耗 排序</text><text text-anchor="middle" x="480.0" y="543" class="body">5 pJ/bit 对应 120 pJ/向量；在满足门槛的已测配置中选 η 最大者</text></svg>